name: redo layer gradients
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild gradient animation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old = '''      .layer-index-item:nth-child(even)::after {
        animation-direction: alternate-reverse;
        animation-name: layerGradientFadeReverse;
      }
      .layer-index-item:nth-child(3) {
        background: var(--black);
        animation-name: layerSlide, layerPulse;
        animation-duration: 4s, 4s;
        animation-timing-function: ease-in-out, ease-in-out;
        animation-iteration-count: infinite, infinite;
      }
      .layer-index-item:nth-child(3)::after {
        background: linear-gradient(90deg, transparent 0%, #315d0f 55%, #a9d06f 100%);
        animation-name: layerGradientFadeGrowth;
      }
      .layer-index-item:nth-child(3) .layer-action,
      .layer-index-item:nth-child(3) .layer-name {
        color: var(--white);
      }
      @keyframes layerSlide {
        0% { margin-left: 0; }
        100% { margin-left: 18%; }
      }
      @keyframes layerPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      @keyframes layerGradientFade {
        0%, 100% { opacity: 0.08; }
        50% { opacity: 0.5; }
      }
      @keyframes layerGradientFadeGrowth {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.68; }
      }
      @keyframes layerGradientFadeReverse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.08; }
      }'''

          new = '''      .layer-index-item:nth-child(even)::after {
        animation-direction: alternate-reverse;
      }
      .layer-index-item:nth-child(3) {
        background: var(--black);
        animation-name: layerSlide, layerPulse;
        animation-duration: 4s, 4s;
        animation-timing-function: ease-in-out, ease-in-out;
        animation-iteration-count: infinite, infinite;
      }
      .layer-index-item:nth-child(3)::after {
        background: linear-gradient(90deg, transparent 0%, #315d0f 55%, #91bb55 100%);
        animation-name: layerEdgeGradientGrowth;
      }
      .layer-index-item:nth-child(3) .layer-action,
      .layer-index-item:nth-child(3) .layer-name {
        color: var(--white);
      }
      @keyframes layerSlide {
        0% { margin-left: 0; }
        100% { margin-left: 18%; }
      }
      @keyframes layerPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      @keyframes layerEdgeGradient {
        0% { opacity: 0; }
        100% { opacity: 0.5; }
      }
      @keyframes layerEdgeGradientGrowth {
        0% { opacity: 0; }
        100% { opacity: 0.68; }
      }'''

          if old not in s:
              raise SystemExit('current layer gradient block not found')
          s = s.replace(old, new, 1)

          # Make the base gradient animation explicit and keep it aligned with
          # the card direction: odd cards run left->right first; rationalisation
          # is even and therefore runs right->left first via alternate-reverse.
          old_base = '''        animation-name: layerGradientFade;
        animation-duration: 4s;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;'''
          new_base = '''        animation-name: layerEdgeGradient;
        animation-duration: 4s;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;'''
          if old_base not in s:
              raise SystemExit('base gradient animation hook not found')
          s = s.replace(old_base, new_base, 1)

          # Remove any stale gradient animation references left by older patches.
          s = s.replace('layerGradientFadeGrowth', 'layerEdgeGradientGrowth')
          s = s.replace('layerGradientFadeReverse', 'layerEdgeGradient')

          p.write_text(s)
          PY
      - name: Remove old gradient workflows and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find .github/workflows -maxdepth 1 -type f \( \
            -name '*gradient*' -o -name '*layer-gradient*' -o -name '*gradient*behavior*' \
          \) ! -name 'redo-layer-gradients.yml' -delete
          git add -A
          git commit -m "fix: rebuild layer gradient animation"
          git push
          rm -f .github/workflows/redo-layer-gradients.yml
          git add -A
          git commit -m "chore: remove temporary gradient workflow"
          git push
