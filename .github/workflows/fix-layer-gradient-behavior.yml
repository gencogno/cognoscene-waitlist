name: fix layer gradient behavior
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch gradient timing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          # Observer + growth: gradient strongest when the card is at the right.
          target = '''      @keyframes layerGradientFade {\n        0%, 100% { opacity: 0.5; }\n        50% { opacity: 0.08; }\n      }\n      @keyframes layerGradientFadeGrowth {\n        0%, 100% { opacity: 0.68; }\n        50% { opacity: 0.12; }\n      }'''
          replacement = '''      @keyframes layerGradientFade {\n        0%, 100% { opacity: 0.08; }\n        50% { opacity: 0.5; }\n      }\n      @keyframes layerGradientFadeGrowth {\n        0%, 100% { opacity: 0.12; }\n        50% { opacity: 0.68; }\n      }\n      @keyframes layerGradientFadeReverse {\n        0%, 100% { opacity: 0.5; }\n        50% { opacity: 0.08; }\n      }'''
          if target not in s:
              raise SystemExit('gradient keyframe block not found')
          s = s.replace(target, replacement, 1)

          # Rationalisation is the even card, whose card animation runs in reverse first.
          target_even = '''      .layer-index-item:nth-child(even)::after {\n        animation-direction: alternate-reverse;\n      }'''
          replacement_even = '''      .layer-index-item:nth-child(even)::after {\n        animation-direction: alternate-reverse;\n        animation-name: layerGradientFadeReverse;\n      }'''
          if target_even not in s:
              raise SystemExit('even-card gradient selector not found')
          s = s.replace(target_even, replacement_even, 1)

          # Growth uses the stronger dedicated gradient animation.
          target_growth = '''      .layer-index-item:nth-child(3)::after {\n        background: linear-gradient(90deg, transparent 0%, #315d0f 55%, #a9d06f 100%);\n        animation-name: layerGradientFadeGrowth;\n      }'''
          replacement_growth = target_growth
          if target_growth not in s:
              raise SystemExit('growth gradient selector not found')

          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-layer-gradient-behavior.yml
          git add index.html .github/workflows/fix-layer-gradient-behavior.yml
          git commit -m "fix: sync layer gradients with card direction"
          git push
