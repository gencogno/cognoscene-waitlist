name: reverse rationalisation gradient
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reverse rationalisation gradient
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '      .layer-index-item:nth-child(2)::after {\n        background: linear-gradient(90deg, transparent 0%, var(--purple) 55%, var(--blue) 100%);'
          new = '      .layer-index-item:nth-child(2)::after {\n        background: linear-gradient(270deg, transparent 0%, var(--purple) 55%, var(--blue) 100%);'
          if old not in s:
              raise SystemExit('Rationalisation gradient target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/reverse-rationalisation-gradient.yml
          git add index.html .github/workflows/reverse-rationalisation-gradient.yml
          git commit -m "style: reverse rationalisation gradient"
          git push
