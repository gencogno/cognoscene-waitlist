name: rebuild gradients
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild gradients
        run: python3 -c "from pathlib import Path; import re; p=Path('index.html'); s=p.read_text(); s=re.sub(r'\\.layer-index-item::after \\{.*?\\n\\s*\\}', '''.layer-index-item::after {\\n        content: '';\\n        position: absolute;\\n        inset: 0;\\n        pointer-events: none;\\n        background: linear-gradient(90deg, transparent 0%, var(--lime-muted) 55%, var(--lime) 100%);\\n        opacity: 0;\\n        animation: layerEdgeGradient 4s ease-in-out infinite alternate;\\n      }''', s, count=1, flags=re.S); s=re.sub(r'\\.layer-index-item:nth-child\\(even\\)::after \\{.*?\\n\\s*\\}', '.layer-index-item:nth-child(even)::after {\\n        animation-direction: alternate-reverse;\\n      }', s, count=1, flags=re.S); s=re.sub(r'\\.layer-index-item:nth-child\\(3\\)::after \\{.*?\\n\\s*\\}', '.layer-index-item:nth-child(3)::after {\\n        background: linear-gradient(90deg, transparent 0%, #315d0f 55%, #91bb55 100%);\\n        animation-name: layerEdgeGradientGrowth;\\n        animation-direction: alternate;\\n      }', s, count=1, flags=re.S); s=re.sub(r'@keyframes layerGradientFade .*?@keyframes layerGradientFadeReverse \\{.*?\\}', '''@keyframes layerEdgeGradient {\\n        0% { opacity: 0; }\\n        100% { opacity: 0.5; }\\n      }\\n      @keyframes layerEdgeGradientGrowth {\\n        0% { opacity: 0; }\\n        100% { opacity: 0.68; }\\n      }''', s, count=1, flags=re.S); s=s.replace('layerGradientFade','layerEdgeGradient'); p.write_text(s);" && ! grep -qE 'layerGradientFade|layerGradientFadeGrowth|layerGradientFadeReverse' index.html
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "fix: rebuild layer gradient animation"
          git push
          rm .github/workflows/rebuild-gradients.yml
          git add .github/workflows/rebuild-gradients.yml
          git commit -m "chore: remove temporary gradient workflow"
          git push
