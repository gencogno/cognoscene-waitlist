name: apply layer gradient fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('''      .layer-index-item:nth-child(3)::after {\n        background: linear-gradient(90deg, transparent 0%, var(--green) 55%, var(--lime) 100%);\n      }''', '''      .layer-index-item:nth-child(3)::after {\n        background: linear-gradient(90deg, transparent 0%, var(--green) 55%, var(--lime) 100%);\n        animation-name: layerGradientFadeGrowth;\n      }''', 1)
          s = s.replace('''      @keyframes layerGradientFade {\n        0% { opacity: 0; }\n        100% { opacity: 0.5; }\n      }''', '''      @keyframes layerGradientFade {\n        0%, 100% { opacity: 0.5; }\n        50% { opacity: 0.08; }\n      }\n      @keyframes layerGradientFadeGrowth {\n        0%, 100% { opacity: 0.68; }\n        50% { opacity: 0.12; }\n      }''', 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-layer-gradient-fix.yml
          git add index.html .github/workflows/apply-layer-gradient-fix.yml
          git commit -m "style: improve layer index gradient"
          git push
