  <style>

    :root {
      --cream: #f5f0e8;
      --cream-2: #ebe4d4;
      --black: #111111;
      --mid: #4a4f47;
      --muted: #8a8a84;
      --line: #ddd5c0;
      --lime: #c8e88a;
      --lime-muted: #a8c870;
      --green: #3b6d11;
      --danger: #c45c4a;
      --white: #ffffff;
      --serif: 'Times New Roman', Times, serif;
      --sans: 'Be Vietnam Pro', system-ui, sans-serif;
      --max: 920px;
      --form-max: 520px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    html { scroll-behavior: smooth; scroll-padding-top: 64px; }

    body {
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.65;
      color: var(--black);
      background: var(--cream);
      text-transform: lowercase;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* top bar — marquee + centered logo */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--black);
      color: var(--cream);
      padding: 11px 0;
      border-bottom: 3px solid var(--lime);
      overflow: hidden;
    }
    .top-bar-marquee {
      display: flex;
      align-items: center;
      min-height: 22px;
    }
    .top-bar-marquee-track {
      display: flex;
      width: max-content;
      animation: top-bar-marquee 32s linear infinite;
    }
    .top-bar-marquee-set {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .top-bar-marquee-item {
      display: inline-flex;
      align-items: center;
      gap: 28px;
      padding: 0 28px;
      font-size: 12px;
      font-weight: 500;
      color: var(--cream);
      white-space: nowrap;
      line-height: 1.4;
    }
    .top-bar-marquee-item strong {
      color: var(--lime);
      font-weight: 800;
    }
    .top-bar-marquee-dot {
      color: var(--lime);
      opacity: 0.55;
      font-size: 10px;
    }
    @keyframes top-bar-marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    .top-bar::before,
    .top-bar::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: min(72px, 12vw);
      z-index: 1;
      pointer-events: none;
    }
    .top-bar::before {
      left: 0;
      background: linear-gradient(to right, var(--black) 15%, transparent);
    }
    .top-bar::after {
      right: 0;
      background: linear-gradient(to left, var(--black) 15%, transparent);
    }
    @media (prefers-reduced-motion: reduce) {
      .top-bar-marquee-track {
        animation: none;
        flex-wrap: wrap;
        width: 100%;
        justify-content: center;
      }
      .top-bar-marquee-set:last-child { display: none; }
    }

    /* chrome-only callout */
    .chrome-band {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--black);
      line-height: 1.45;
      margin-bottom: 16px;
      max-width: 420px;
    }
    .chrome-band strong { font-weight: 800; color: var(--black); }
    .chrome-band span { color: var(--black); }

    /* hero — brand sits below top bar; copy + visual grid */
    .hero {
      padding-bottom: 48px;
    }
    .hero-brand {
      padding-top: 1cm;
      margin-bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      text-align: center;
    }
    .hero-brand-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-inline: auto;
      width: fit-content;
      text-decoration: none;
      color: var(--black);
    }
    .hero-brand-mark {
      display: block;
      flex-shrink: 0;
      height: 28px;
      width: auto;
      object-fit: contain;
    }
    .hero-brand-wordmark {
      display: block;
      flex-shrink: 0;
      height: 14px;
      width: auto;
      object-fit: contain;
    }
    .hero-main {
      padding-top: 1cm;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      align-items: center;
    }

    .hero-copy h1 {
      font-family: var(--serif);
      font-size: clamp(1.85rem, 4.5vw, 2.75rem);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.05em;
      margin-bottom: 12px;
    }

    .hero-sub {
      font-size: 15px;
      font-weight: 800;
      color: var(--black);
      line-height: 1.4;
      margin-bottom: 14px;
      max-width: 420px;
    }

    .hero-lead {
      font-size: 15px;
      color: var(--mid);
      margin-bottom: 24px;
      max-width: 420px;
      line-height: 1.6;
    }

    .btn-primary {
      display: inline-block;
      background: var(--black);
      color: var(--lime);
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .hero-meta {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .mobile-only { display: none; }

    .hero-cta-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hero-roadmap-sheet {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(17, 17, 17, 0.55);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }
    .hero-roadmap-sheet.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .hero-sheet-dialog {
      width: calc(100% - 32px);
      max-width: 440px;
      margin-bottom: 24px;
      padding: 20px 18px 18px;
      background: #fff;
      border: 1px solid #e8e2d6;
      border-radius: 20px;
      text-align: center;
      transform: translateY(110%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hero-roadmap-sheet.is-open .hero-sheet-dialog { transform: translateY(0); }
    .hero-sheet-dialog h3 {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .hero-sheet-dialog p {
      font-size: 13px;
      color: #666;
      line-height: 1.55;
      margin-bottom: 14px;
    }
    .hero-sheet-dismiss {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 13px 16px;
      background: #111;
      color: #C8E88A;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .hero-info-btn {
      width: 44px;
      height: 44px;
      border: 1px solid #d8d2c6;
      border-radius: 999px;
      background: #fff;
      color: #888;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1;
      font-family: inherit;
    }
    .hero-info-btn[aria-expanded="true"] {
      background: #C8E88A;
      border-color: #111;
      color: #111;
    }

    /* showcase video frames — padded, thick rounded border */
    .showcase-video-frame {
      position: relative;
      max-width: 360px;
      margin: 0 auto;
      border: 3px solid var(--black);
      border-radius: 32px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
    }
    .showcase-video-frame:focus-within,
    .showcase-video-frame:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.12);
    }
    .showcase-video-hit {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: none;
      background: var(--cream);
      cursor: pointer;
      font: inherit;
      color: inherit;
      text-align: inherit;
      text-transform: inherit;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      line-height: 0;
    }
    .showcase-video-hit:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 3px;
    }
    .showcase-video-hint {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: rgba(17, 17, 17, 0.52);
      color: var(--lime);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    .showcase-video-hint::after {
      content: "click to enlarge";
    }
    .showcase-video-frame:hover .showcase-video-hint,
    .showcase-video-frame:focus-within .showcase-video-hint,
    .showcase-video-hit:hover .showcase-video-hint,
    .showcase-video-hit:focus-visible .showcase-video-hint {
      opacity: 1;
    }
    @media (hover: none) {
      .showcase-video-hint {
        opacity: 0.88;
        font-size: 11px;
        background: rgba(17, 17, 17, 0.4);
      }
      .showcase-video-hint::after {
        content: "tap to enlarge";
      }
    }
    .showcase-video-frame--hero {
      max-width: 440px;
      padding: 18px;
      border-radius: 36px;
    }
    .showcase-video-hit .showcase-video,
    .showcase-video-stage .showcase-video {
      display: block;
      width: 100%;
      height: auto;
      background: var(--cream);
      vertical-align: middle;
    }
    .showcase-video-stage {
      display: grid;
      grid-template-columns: 1fr;
      background: var(--cream);
    }
    .showcase-video-stage .showcase-video {
      grid-row: 1;
      grid-column: 1;
      width: 100%;
      height: auto;
      vertical-align: middle;
      opacity: 0;
      transform: translateX(14px) scale(0.988);
      transition:
        opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1),
        transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      will-change: opacity, transform;
    }
    .showcase-video-stage .showcase-video.is-active {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
      z-index: 1;
    }
    .showcase-video-stage .showcase-video.is-exiting {
      opacity: 0;
      transform: translateX(-14px) scale(0.988);
      z-index: 0;
    }
    .showcase-video-stage .showcase-video.slide-from-left {
      transform: translateX(-14px) scale(0.988);
    }
    .showcase-video-stage .showcase-video.slide-from-right {
      transform: translateX(14px) scale(0.988);
    }
    @media (prefers-reduced-motion: reduce) {
      .showcase-video-stage .showcase-video {
        transition: opacity 0.15s ease;
        transform: none;
      }
      .showcase-video-stage .showcase-video.is-exiting,
      .showcase-video-stage .showcase-video.slide-from-left,
      .showcase-video-stage .showcase-video.slide-from-right {
        transform: none;
      }
      #videoLightboxPlayer {
        transition: opacity 0.15s ease !important;
      }
    }
    .showcase-video-tag {
      display: block;
      margin-top: 12px;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
    }

    .showcase-video-slider {
      max-width: 360px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .showcase-video-slider .showcase-video-frame {
      width: 100%;
      margin: 0 auto;
    }
    .showcase-video-slider:hover .showcase-video-frame,
    .showcase-video-slider:focus-within .showcase-video-frame {
      transform: translateY(-2px);
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.12);
    }
    .showcase-video-slider-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
      width: 100%;
    }
    .slider-arrow {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--black);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
    }
    .slider-arrow:hover {
      border-color: var(--black);
      background: var(--cream);
    }
    .slider-arrow:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 2px;
    }
    .slider-pills {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .slider-pill {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--mid);
      border-radius: 999px;
      padding: 5px 10px;
      font: inherit;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      text-transform: lowercase;
    }
    .slider-pill.is-active {
      background: var(--black);
      color: var(--lime);
      border-color: var(--black);
    }
    .slider-pill:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 2px;
    }
    .showcase-video-slider .slider-caption {
      margin-top: 8px;
    }

    /* video lightbox */
    .video-lightbox {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }
    .video-lightbox.is-open {
      opacity: 1;
      visibility: visible;
    }
    .video-lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(17, 17, 17, 0.72);
      border: none;
      cursor: pointer;
    }
    .video-lightbox-dialog {
      position: relative;
      z-index: 1;
      width: min(920px, 100%);
      max-height: calc(100vh - 48px);
      overflow: auto;
    }
    .video-lightbox-close {
      position: absolute;
      top: 28px;
      right: 28px;
      z-index: 3;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 999px;
      background: var(--black);
      color: var(--lime);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }
    .video-lightbox-close:hover {
      background: #2a2a28;
    }
    .video-lightbox-title {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 800;
      color: var(--cream);
      text-align: center;
    }
    .video-lightbox-frame {
      position: relative;
      padding: 14px;
      background: var(--cream);
      border: 6px solid var(--black);
      border-radius: 36px;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }
    .video-lightbox-frame video {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100vh - 160px);
      background: var(--cream);
      border-radius: 24px;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #videoLightboxPlayer.is-fading {
      opacity: 0;
    }
    .video-lightbox-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .video-lightbox-nav[hidden] {
      display: none !important;
    }
    .video-lightbox-nav .slider-arrow {
      background: rgba(245, 240, 232, 0.12);
      border-color: rgba(245, 240, 232, 0.28);
      color: var(--cream);
    }
    .video-lightbox-nav .slider-arrow:hover {
      background: rgba(245, 240, 232, 0.2);
      border-color: var(--cream);
    }
    .video-lightbox-nav .slider-pill {
      background: rgba(245, 240, 232, 0.08);
      border-color: rgba(245, 240, 232, 0.22);
      color: var(--cream);
    }
    .video-lightbox-nav .slider-pill.is-active {
      background: var(--lime);
      color: var(--black);
      border-color: var(--lime);
    }
    body.video-lightbox-open {
      overflow: hidden;
    }

    /* hero visual — overlapping UI mockups */
    .hero-visual {
      position: relative;
      min-height: 400px;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .hero-screenshot-stack {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 380px;
    }
    .hero-shot {
      position: absolute;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.14);
      background: var(--cream);
      transform-origin: center center;
    }
    /* scale hierarchy: growth dashboard (largest) → soft (medium) → hold (smallest) */
    .hero-shot--growth {
      left: 0;
      bottom: 4%;
      width: 100%;
      z-index: 1;
      transform: rotate(-2.5deg);
    }
    .hero-shot--soft {
      left: 4%;
      top: 0;
      width: 82%;
      z-index: 2;
      transform: rotate(1.5deg);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.12), 0 0 0 2px rgba(200, 232, 138, 0.55);
    }
    .hero-shot--hold {
      right: -2%;
      top: 34%;
      width: 68%;
      z-index: 3;
      transform: rotate(2.5deg);
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.18), 4px 4px 0 var(--lime);
    }
    .hero-mock-head {
      background: var(--cream);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      border-bottom: 1px solid var(--line);
      gap: 8px;
    }
    .hero-mock-head span:first-child {
      font-weight: 800;
      color: var(--black);
    }
    .hero-mock-wordmark {
      height: 9px;
      width: auto;
      max-width: 76px;
      display: block;
      object-fit: contain;
      object-position: left center;
    }
    .hero-mock-brand {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }
    .hero-mock-mark {
      height: 11px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
    }
    .hero-mock-head--brand {
      justify-content: flex-start;
    }
    .hero-dashboard-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 9px;
      font-weight: 700;
    }
    .hero-dashboard-tabs span {
      color: var(--muted);
    }
    .hero-dashboard-tabs span.is-active {
      color: var(--black);
      font-weight: 800;
    }
    .hero-mock-body {
      padding: 12px;
      background: var(--cream);
    }
    .hero-mock-body--dashboard {
      padding: 10px;
    }
    .hero-dashboard-stat {
      background: var(--cream);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .hero-dashboard-stat .lbl {
      font-size: 8px;
      color: var(--muted);
    }
    .hero-dashboard-stat .num {
      font-size: 20px;
      font-weight: 800;
      color: var(--green);
      line-height: 1.1;
    }
    .hero-dashboard-stat .sub {
      font-size: 8px;
      color: var(--muted);
    }
    .hero-dashboard-rationalised {
      background: var(--black);
      color: var(--lime);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      gap: 8px;
      align-items: center;
